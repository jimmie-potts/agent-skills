name: Validate agent skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependency
        run: python3 -m pip install -r requirements-dev.txt

      - name: Validate catalog
        run: python3 scripts/validate-skills.py

      - name: Test canonical skills
        run: |
          python3 tests/architect-test.py
          python3 tests/blast-radius-test.py
          python3 tests/deliver-work-test.py
          python3 tests/plan-work-test.py
          python3 tests/improve-codebase-architecture-test.py
          python3 tests/workflow-evaluation-test.py
          python3 tests/grilling-skills-test.py
          python3 tests/interrogate-test.py
          python3 tests/matt-engineering-skills-test.py
          python3 tests/matt-productivity-skills-test.py
          python3 tests/pi-skills-test.py
          python3 tests/pstack-analysis-skills-test.py
          python3 tests/pstack-workflow-skills-test.py
          python3 tests/unslop-test.py
          python3 tests/writing-for-agents-test.py

      - name: Check repository shell syntax
        run: |
          bash -n scripts/manage-skills.sh
          bash -n tests/manage-skills-test.sh

      - name: Test skill management
        run: bash tests/manage-skills-test.sh

      - name: Check patch whitespace
        env:
          PATCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$PATCH_BASE_SHA" && "$PATCH_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! git cat-file -e "$PATCH_BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PATCH_BASE_SHA"
            fi
            git diff --check "$PATCH_BASE_SHA" HEAD
          else
            git diff-tree --check --root -r HEAD
          fi

  architecture-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare isolated browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/architecture-report-deps" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/architecture-report-deps/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify offline report at desktop and mobile widths
        env:
          NODE_PATH: ${{ runner.temp }}/architecture-report-deps/node_modules
          ARCHITECTURE_REPORT_OUTPUT: ${{ runner.temp }}/architecture-report-output
        run: node tests/architecture-report-browser-test.cjs

      - name: Preserve report verification artifacts
        uses: actions/upload-artifact@v5
        with:
          name: architecture-report
          path: ${{ runner.temp }}/architecture-report-output
          if-no-files-found: error
